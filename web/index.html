<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Project Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f9fb;
      color: #1a1a2e;
      padding: 2rem 1rem;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; }
    label { font-weight: 600; font-size: 0.875rem; display: block; margin-bottom: 0.25rem; }
    input, textarea, select {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      font-family: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .result { margin-top: 2rem; display: none; }
    .result.visible { display: block; }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .card pre {
      background: #f3f4f6;
      padding: 1rem;
      border-radius: 0.5rem;
      white-space: pre-wrap;
      font-size: 0.85rem;
      max-height: 400px;
      overflow: auto;
    }
    .error { background: #fef2f2; border-color: #fecaca; }
    .error h3 { color: #b91c1c; }
    .loading { text-align: center; margin-top: 2rem; color: #666; }
    .loading .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid #2563eb;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Project Planner</h1>
    <p class="subtitle">3-agent CrewAI crew — breaks down, estimates, and allocates your project</p>

    <form id="planForm">
      <label for="project_type">Project Type</label>
      <input id="project_type" name="project_type" value="Website" required>

      <label for="industry">Industry</label>
      <input id="industry" name="industry" value="Technology" required>

      <label for="team_members">Team Members</label>
      <textarea id="team_members" name="team_members" required>- John Doe (Project Manager)
- Jane Doe (Software Engineer)
- Bob Smith (Designer)
- Alice Johnson (QA Engineer)
- Tom Brown (QA Engineer)</textarea>

      <label for="project_requirements">Project Requirements</label>
      <textarea id="project_requirements" name="project_requirements" required>- Create a responsive design
- Implement a modern UI
- Develop a user-friendly navigation system
- Include About Us, Services, Contact Us pages
- Implement a blog section
- Ensure fast loading and SEO
- Integrate social media
- Include a testimonials section</textarea>

      <button type="submit" id="submitBtn">Generate Project Plan</button>
    </form>

    <div id="loading" class="loading" style="display:none;">
      <span class="spinner"></span> Running 3 agents on Groq Llama 3.3...
    </div>

    <div id="result" class="result">
      <div class="card">
        <h3>Usage</h3>
        <pre id="usage"></pre>
      </div>
      <div class="card">
        <h3>Structured Plan (JSON)</h3>
        <pre id="planJson"></pre>
      </div>
    </div>

    <div id="error" class="result card error">
      <h3>Error</h3>
      <pre id="errorMsg"></pre>
    </div>
  </div>

  <script>
    document.getElementById("planForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");
      const error = document.getElementById("error");

      btn.disabled = true;
      loading.style.display = "block";
      result.classList.remove("visible");
      error.classList.remove("visible");

      const body = {
        project_type: document.getElementById("project_type").value,
        industry: document.getElementById("industry").value,
        team_members: document.getElementById("team_members").value,
        project_requirements: document.getElementById("project_requirements").value,
      };

      try {
        const res = await fetch("/api/plan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);

        document.getElementById("usage").textContent = data.usage
          ? JSON.stringify(data.usage, null, 2)
          : "N/A";
        document.getElementById("planJson").textContent = JSON.stringify(data, null, 2);
        result.classList.add("visible");
      } catch (err) {
        document.getElementById("errorMsg").textContent = err.message;
        error.classList.add("visible");
      } finally {
        btn.disabled = false;
        loading.style.display = "none";
      }
    });
  </script>
</body>
</html>
