data_collection:
  description: >
    Use the available data source tools (Trello Board Data Fetcher or
    DbProjectFetcher) to collect all project tasks, their statuses,
    due dates, comments, and team assignments. Return the raw data as
    a structured JSON array of tasks with all relevant fields.
  expected_output: >
    A JSON array of task objects with fields: id, name, status,
    due_date, assignee, comments, labels.
  agent: data_collection_agent

data_analysis:
  description: >
    Analyze the collected task data. Calculate:
    - Total tasks, completed, in progress, blocked
    - Overdue tasks (past due_date and not done)
    - Blocked tasks (status = blocked)
    - Overall completion percentage
    - Any patterns or risks
    Return a structured analysis summary.
  expected_output: >
    A structured analysis with: total_tasks, completed, in_progress,
    blocked, overdue, completion_pct, risks list, blockers list.
  agent: analysis_agent

report_generation:
  description: >
    Write a professional sprint progress report in markdown format.
    Include:
    1. Executive summary (2-3 sentences)
    2. Progress overview (completion %)
    3. Tasks completed this sprint
    4. Tasks in progress
    5. Blockers and risks
    6. Overdue items
    7. Recommended next actions
    Make it clear, concise, and actionable.
  expected_output: >
    A markdown-formatted sprint report with all sections listed above.
  agent: analysis_agent
