[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmagent"
version = "0.1.0"
description = "AI-powered Project Management with CrewAI — bilingual planning, risk, and resource allocation for GCC markets"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.86.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
pmagent = "pmagent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.crewai]
# CrewAI project config
name = "pmagent"
version = "0.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
